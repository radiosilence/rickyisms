[package]
name = "rickyism"
version = "0.1.0"
edition = "2024"
description = "Prints a Rickyism of the day, for use as a shell MOTD"
license = "MIT AND CC-BY-SA-3.0"
repository = "https://github.com/radiosilence/rickyisms"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
